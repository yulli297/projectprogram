<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그린 아크 프로젝트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7ef; --paper:#fff; --ink:#2b3a2e; --sub:#6b7a6d; --line:#dfe8d9;
  --main:#3f8f5a; --main2:#2f6f45;
  --home:#e07b4f; --food:#4fa357; --energy:#e3a91b; --water:#3a8bd1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:62px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--main)}
.hidden{display:none!important}
.btn{background:var(--main);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;font-weight:700}
.btn:hover{background:var(--main2)}
.btn.ghost{background:#fff;color:var(--main);border:2px solid var(--main)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.red{background:#d9534f}

/* ---------- 입장 화면 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(180deg,#bfe3f5 0%,#e3f4dc 60%,#a9d79a 100%)}
.login-box{background:#fff;border-radius:24px;padding:32px 36px;width:min(560px,100%);box-shadow:0 10px 30px rgba(0,0,0,.12);text-align:center}
.login-box h1{font-size:38px;color:var(--main2)}
.login-box p.sub{color:var(--sub);margin:4px 0 22px}
.group-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 16px}
.group-grid button{padding:14px 0;border-radius:12px;background:#eef5ea;font-family:'Jua';font-size:20px;color:var(--main2);border:2px solid transparent}
.group-grid button.on{background:var(--main);color:#fff}
.class-grid{grid-template-columns:repeat(5,1fr)}
.login-warn{margin-top:14px;background:#fff1ee;border:2px solid #f3b8aa;color:#a33a22;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55}
/* 화면 높이가 낮은 태블릿 가로 화면: 입장 화면을 한눈에 */
@media (max-height:720px){
  #login{padding:8px}
  .login-box{padding:16px 26px}
  .login-box h1{font-size:28px}
  .login-box p.sub{margin:0 0 8px}
  .group-grid{margin:4px 0 8px}
  .group-grid button{padding:8px 0;font-size:17px}
  .login-warn{margin-top:8px;padding:6px 10px;font-size:14px}
  .login-box .btn{margin-top:10px!important;padding:10px!important}
}
.login-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.login-row input{letter-spacing:2px}
.pin-list{display:flex;flex-wrap:wrap;gap:6px}
.pin-list span{background:#f3f6f2;border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.code-big{font-family:'Jua';font-size:34px;letter-spacing:3px;color:var(--main2);text-align:center;background:#f0f9f2;border-radius:12px;padding:6px;margin:6px 0}
.login-box label{display:block;text-align:left;font-weight:700;margin-bottom:6px}
.teacher-link{margin-top:16px;font-size:13px;color:var(--sub);background:none;text-decoration:underline}

/* ---------- 상단 ---------- */
header{background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20}
header .logo{font-family:'Jua';font-size:24px;color:var(--main2);white-space:nowrap}
.steps{display:flex;gap:6px;flex:1;justify-content:center}
.step{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#eef2ec;color:var(--sub);font-weight:700;font-size:14px}
.step.on{background:var(--main);color:#fff}
.step.lock{opacity:.5;cursor:not-allowed}
.me{font-size:14px;color:var(--sub);white-space:nowrap}
.me b{color:var(--ink)}

main{padding:18px 22px 40px;max-width:1400px;margin:0 auto}
.subtabs{display:flex;gap:8px;margin-bottom:14px}
.subtab{padding:9px 18px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;color:var(--sub);font-size:15px}
.subtab.on{border-color:var(--main);color:var(--main2);background:#eaf5e6}
.guide{background:#fff;border-left:6px solid var(--main);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:15px;line-height:1.6}

/* ---------- 갤러리 ---------- */
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--sub)}
.chip.on{color:#fff;border-color:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;position:relative}
.card:hover{transform:translateY(-3px)}
.card .pic{aspect-ratio:4/3;width:100%;display:block;object-fit:cover;background:#eee}
.card .body{padding:10px 12px 12px}
.card h3{font-size:19px;margin-bottom:4px}
.card p{font-size:13px;color:var(--sub);line-height:1.45}
.tags{display:flex;gap:4px;margin-bottom:6px}
.tag{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:999px}
.real{margin-top:10px;background:#eef5ff;color:#2c5d8f;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.real.sm{margin-top:7px;padding:5px 8px;font-size:12px}
/* 기후 난민 원인 칸 */
.cause{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;border-top:6px solid #8a6bd1}
.cause h3{font-size:21px;margin-bottom:4px}
.cause .hint{font-size:13px;color:var(--sub);margin-bottom:8px}
.cause .write{display:flex;gap:8px;margin-bottom:10px}
.cause .write input{flex:1}
.cause .notes{display:flex;flex-wrap:wrap;gap:8px}
.cause .note{background:#f1ebff;margin:0;min-width:180px;max-width:320px}
.memo-done{position:absolute;top:8px;right:8px;background:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--main2);box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* ---------- 모달 ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:20px;width:min(960px,100%);max-height:94vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.modal .left{padding:18px}
.modal .left .pic{width:100%;border-radius:14px;aspect-ratio:4/3;object-fit:cover}
.modal .left h2{font-size:28px;margin:10px 0 6px}
.modal .left p{line-height:1.7;font-size:15px}
.modal .q{margin-top:12px;background:#fff8e1;border-radius:10px;padding:10px 12px;font-weight:700;font-size:15px}
.modal .right{padding:18px;background:#f7faf5;display:flex;flex-direction:column;gap:10px}
.modal .right h3{font-size:22px;color:var(--main2)}
.modal .right label{font-weight:700;font-size:14px}
.modal .row{display:flex;gap:8px;margin-top:auto}
.close-x{background:none;font-size:26px;color:var(--sub);float:right}

/* ---------- 모둠 보드 ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#fff;border-radius:16px;padding:10px;min-height:300px;border-top:6px solid}
.col h3{font-size:20px;padding:4px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.col h3 small{font-family:'Noto Sans KR';font-size:12px;color:var(--sub)}
.note{background:#fffbe0;border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:14px;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.note .from{font-size:11px;color:var(--sub);margin-bottom:3px}
.note .k{font-weight:700;color:var(--main2)}
.note .foot{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;color:var(--sub)}
.heart{background:#fff;border:1.5px solid #f0c3c3;border-radius:999px;padding:2px 9px;font-size:13px}
.heart.on{background:#ffe1e1;border-color:#e88}
.board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}

/* ---------- 건물 목록 ---------- */
.blist-wrap{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.concept{margin-bottom:16px;border:3px solid #cfe9d6}
.concept .cgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:4px 14px}
.concept .cview h2{font-family:'Jua';font-weight:400;font-size:26px;color:var(--main)}
.concept .cview .theme{font-size:17px;font-weight:700;margin:4px 0 8px}
.concept .cview p{white-space:pre-wrap;line-height:1.6;color:#444}
.locked-panel{opacity:.55;pointer-events:none}
.tvil{position:fixed;inset:0;z-index:45;background:#eef6f0;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.tvil .thead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tvil .vwrap{flex:1;height:auto;min-height:0;grid-template-columns:260px 1fr}
.vconcept{background:#f0f9f2;border-radius:12px;padding:10px;margin-bottom:8px}
.vconcept b{font-family:'Jua';font-weight:400;font-size:20px;color:var(--main);display:block}
.vconcept .theme{font-weight:700;font-size:14px;margin:2px 0 4px}
.vconcept p{font-size:13px;line-height:1.5;color:#555;white-space:pre-wrap}
.dcard{border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:120px 1fr;gap:12px;margin-bottom:10px;background:#fff}
.dcard .thumb{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px;display:flex;align-items:center;justify-content:center;min-height:110px;font-size:12px;color:#999}
.dcard .thumb img{max-width:100%;max-height:140px}
.dcard h4{font-size:18px;margin-bottom:4px}
.dcard .dinfo{font-size:14px;line-height:1.6}
.dcard .k{font-weight:700;color:var(--main)}
.panel{background:#fff;border-radius:16px;padding:16px}
.panel h3{font-size:21px;margin-bottom:10px}
.panel label{font-weight:700;font-size:14px;display:block;margin:10px 0 5px}
.catpick{display:flex;gap:6px;flex-wrap:wrap}
.catpick button{padding:7px 11px;border-radius:10px;background:#f0f3ee;font-weight:700;font-size:13px;color:var(--sub);border:2px solid transparent}
.check{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.check span{padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px}
.check .ok{background:#e3f4dc;color:var(--main2)}
.check .no{background:#ffe9e0;color:#c0502a}
.bitem{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px}
.bitem .num{font-family:'Jua';font-size:22px;color:var(--main);width:28px}
.bitem .info{flex:1}
.bitem .info b{font-size:17px}
.bitem .info p{font-size:13px;color:var(--sub);margin-top:2px}
.owner{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef5ea;color:var(--main2);white-space:nowrap}

/* ---------- 2단계 설계 ---------- */
.design{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.design .panel label{margin:14px 0 6px}
.design .panel label:first-of-type{margin-top:0}
.feat{display:grid;grid-template-columns:28px 1fr 130px;gap:8px;align-items:center;margin-bottom:8px}
.feat b{font-family:'Jua';font-size:20px;color:var(--main);text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats button{padding:7px 12px;border-radius:999px;background:#f0f3ee;font-weight:700;font-size:13px;color:var(--sub);border:2px solid transparent}
.mats button.on{background:#e3f4dc;color:var(--main2);border-color:var(--main)}
.prompt-box{position:sticky;top:76px}
.prompt{white-space:pre-wrap;background:#f7faf5;border:2px dashed var(--main);border-radius:14px;padding:14px;font-size:14px;line-height:1.65;max-height:52vh;overflow:auto}
.how{font-size:14px;line-height:1.8;margin-top:12px;background:#fffbe8;border-radius:12px;padding:10px 14px}
.toggle{display:flex;gap:6px;margin-bottom:10px}
.toggle button{flex:1;padding:9px;border-radius:10px;background:#f0f3ee;font-weight:700;font-size:14px;color:var(--sub);border:2px solid transparent}
.toggle button.on{background:var(--main);color:#fff}
.status{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.status.ok{background:#e3f4dc;color:var(--main2)}
.status.no{background:#ffe9e0;color:#c0502a}
/* ---------- 3단계 건물 ---------- */
.checker{background:conic-gradient(#e9eee6 25%,#fff 0 50%,#e9eee6 0 75%,#fff 0) 0 0/24px 24px;border-radius:14px;border:2px solid var(--line);display:flex;justify-content:center;overflow:hidden}
.checker canvas{max-width:100%;max-height:50vh;touch-action:none;cursor:crosshair;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tools .tg{padding:9px 14px;border-radius:10px;background:#f0f3ee;font-weight:700;font-size:14px;color:var(--sub)}
.tools .tg.on{background:var(--main);color:#fff}
.slide{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--sub);margin-top:8px}
.slide input{flex:1;padding:0;border:none}
.filebtn{display:block;text-align:center;margin-top:10px;cursor:pointer}
.savedpic{margin-top:14px;text-align:center;background:#f7faf5;border-radius:14px;padding:12px}
.savedpic img{max-width:200px;max-height:200px}
.empty{padding:50px 10px;text-align:center;color:var(--sub);border:2px dashed var(--line);border-radius:14px}
/* ---------- 4단계 마을 ---------- */
.vwrap{display:grid;grid-template-columns:214px 1fr;gap:12px;height:calc(100vh - 168px);min-height:430px}
.vside{background:#fff;border-radius:16px;padding:10px;overflow:auto}
.vside h4{font-family:'Jua';font-weight:400;font-size:17px;margin:10px 2px 6px}
.vside h4:first-child{margin-top:0}
.vtools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vtools button{padding:8px 4px;border-radius:10px;background:#f0f3ee;font-weight:700;font-size:13px;color:var(--ink);border:2px solid transparent}
.vtools button.on{border-color:var(--main);background:#e3f4dc}
.vtray button{display:flex;align-items:center;gap:8px;width:100%;padding:6px;border-radius:10px;background:#f7faf5;margin-bottom:6px;text-align:left;font-size:13px;font-weight:700;color:var(--ink)}
.vtray img{width:44px;height:44px;object-fit:contain}
.vtray small{display:block;font-weight:400;color:var(--sub)}
.vprops{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.vprops button{background:#f7faf5;border-radius:8px;padding:4px;height:46px}
.vprops img{width:100%;height:100%;object-fit:contain}
.vport{position:relative;background:linear-gradient(180deg,#bfe3f5,#e6f5fb);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.vworld{position:absolute;left:0;top:0;transform-origin:0 0}
.vworld canvas{display:block}
#vItems{position:absolute;inset:0}
.vi{position:absolute;width:0;height:0}
.vi img{position:absolute;bottom:-3px;max-width:none;-webkit-user-drag:none}
.vi .sh{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:rgba(0,0,0,.2);border-radius:50%;pointer-events:none}
.vi .lb{position:absolute;top:5px;left:0;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.9);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;pointer-events:none}
.vi.sel img{filter:drop-shadow(0 0 3px #ff9800) drop-shadow(0 0 7px #ffd400)}
.vzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.vzoom button,.vbar button{width:44px;height:44px;border-radius:12px;background:#fff;font-size:20px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.18);color:var(--ink)}
.vbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.92);padding:8px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.2);align-items:center}
.vbar button{box-shadow:none;background:#eef2ec}
.vbar .sep{width:1px;height:30px;background:#ccd}
.vbar .nm{font-weight:700;font-size:13px;padding:0 6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmsg{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);padding:6px 12px;border-radius:10px;font-size:13px;font-weight:700}
/* ---------- 준비 중 ---------- */
.soon{background:#fff;border-radius:20px;padding:50px;text-align:center}
.soon .big{font-size:60px}
.soon h2{font-size:30px;margin:10px 0}
.soon p{color:var(--sub);line-height:1.7}

/* ---------- 교사 ---------- */
.t-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.stage-btns{display:grid;gap:8px}
.stage-btns button{padding:12px;border-radius:12px;background:#f0f3ee;font-weight:700;text-align:left;font-size:15px;color:var(--ink)}
.stage-btns button.on{background:var(--main);color:#fff}
.gsel{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;z-index:99;font-size:15px}
.mode-badge{font-size:12px;padding:3px 8px;border-radius:6px;background:#fff3cd;color:#8a6d00;font-weight:700}
</style>
</head>
<body>

<!-- ================= 입장 ================= -->
<section id="login">
  <div class="login-box">
    <h1>🌱 그린 아크 프로젝트</h1>
    <p class="sub">기후 위기를 이겨내는 우리 모둠의 미래 마을 만들기</p>
    <label>우리 반</label>
    <div class="group-grid class-grid" id="classGrid"></div>
    <label>우리 모둠</label>
    <div class="group-grid" id="groupGrid"></div>
    <div class="login-row">
      <div><label>이름 (실명)</label><input id="nameInput" placeholder="예) 김민수" maxlength="10"></div>
      <div><label>반 입장 코드</label><input id="codeInput" inputmode="numeric" placeholder="칠판에 있어요" maxlength="10" onkeydown="if(event.key==='Enter')App.enter()"></div>
    </div>
    <div class="login-warn">⚠️ 장난으로라도 다른 반에 들어가면 정보가 오염되어 초기화해야 합니다.<br><b>5반 선생님이 가만두지 않을 것!</b></div>
    <button class="btn" style="width:100%;margin-top:16px;font-size:17px;padding:13px" onclick="App.enter()">입장하기</button>
    <button class="teacher-link" onclick="App.teacherLogin()">선생님 화면</button>
    <div style="margin-top:10px" id="modeInfo"></div>
  </div>
</section>

<!-- ================= 학생 ================= -->
<section id="studentApp" class="hidden">
  <header>
    <div class="logo">🌱 그린 아크 프로젝트</div>
    <nav class="steps" id="steps"></nav>
    <div class="me" id="meInfo"></div>
  </header>
  <main id="studentMain"></main>
</section>

<!-- ================= 교사 ================= -->
<section id="teacherApp" class="hidden">
  <header>
    <div class="logo">🌱 그린 아크 프로젝트 · 선생님</div>
    <div style="flex:1"></div>
    <button class="btn ghost sm" onclick="location.reload()">나가기</button>
  </header>
  <main id="teacherMain"></main>
</section>

<div id="modalRoot"></div>

<script type="module">
/* =========================================================
   1. 설정 — Firebase 설정값을 붙여넣으면 모든 기기가 공유됩니다.
      비워 두면 '체험 모드'(이 기기 안에서만 저장)로 작동합니다.
   ========================================================= */
const FIREBASE_CONFIG = {

/* =========================================================
   6. 저장소 (Firebase 또는 체험 모드)
      - 모둠당 문서 1개: { notes:[...], buildings:[...] }
      - 설정 문서 1개:   { stage: 1~4 }
   ========================================================= */
const useFirebase = !!FIREBASE_CONFIG.projectId;
let DB;

if (useFirebase){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(FIREBASE_CONFIG);
  const db = fs.getFirestore(app);
  const ref = id => fs.doc(db, ROOT, "c"+CLS+"_"+id);   // 반마다 따로: c1_g1, c2_g1 …
  DB = {
    watch(id, cb){ return fs.onSnapshot(ref(id), s => cb(s.exists()? s.data() : {})); },
    async get(id){ const s = await fs.getDoc(ref(id)); return s.exists()? s.data() : {}; },
    async update(id, fn){
      await fs.runTransaction(db, async tx => {
        const s = await tx.get(ref(id));
        const data = s.exists()? s.data() : {};
        fn(data);
        tx.set(ref(id), data);
      });
    },
  };
} else {
  // 체험 모드: 이 기기의 브라우저에만 저장 (같은 기기 여러 탭끼리는 공유)
  const key = id => ROOT+"_c"+CLS+"_"+id;
  const subs = {};
  const read = id => { try{ return JSON.parse(localStorage.getItem(key(id))||"{}"); }catch(e){ return {}; } };
  const fire = id => (subs[id]||[]).forEach(cb => cb(read(id)));
  window.addEventListener("storage", e => { Object.keys(subs).forEach(id => { if(e.key===key(id)) fire(id); }); });
  DB = {
    watch(id, cb){ (subs[id] ||= []).push(cb); cb(read(id)); return ()=>{ subs[id]=subs[id].filter(f=>f!==cb); }; },
    async get(id){ return read(id); },
    async update(id, fn){ const d = read(id); fn(d); try{ localStorage.setItem(key(id), JSON.stringify(d)); }catch(e){} fire(id); },
  };
}

function dialog(msg, withInput){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="panel" style="width:min(380px,100%);text-align:center">
      <p style="font-size:17px;font-weight:700;margin:6px 0 14px">${esc(msg)}</p>
      ${withInput?`<input type="password" id="dlgIn" style="margin-bottom:12px">`:""}
      <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" data-a="0">취소</button><button class="btn" style="flex:1" data-a="1">확인</button></div></div>`;
    document.body.appendChild(bg);
    const inp = bg.querySelector("#dlgIn"); if(inp){ inp.focus(); inp.onkeydown = e => { if(e.key==="Enter") bg.querySelector('[data-a="1"]').click(); }; }
    bg.onclick = e => { const a = e.target.dataset?.a; if(a===undefined) return; bg.remove(); res(withInput ? (a==="1" ? inp.value : null) : a==="1"); };
  });
}

    $("#modeInfo").innerHTML = useFirebase ? "" : `<span class="mode-badge">체험 모드 · 이 기기에만 저장돼요</span>`;
    try{
      const last = JSON.parse(localStorage.getItem(ROOT+"_me")||"null");
      if(last){
        $("#nameInput").value = last.name || ""; $("#codeInput").value = last.code || "";
        document.querySelector(`#classGrid button[data-c="${last.cls}"]`)?.click();
        document.querySelector(`#groupGrid button[data-g="${last.group}"]`)?.click();
      }
    }catch(e){}
  },

  async enter(){
    if(App.busy) return;
    const name = $("#nameInput").value.trim().replace(/\s+/g,"");
    const code = $("#codeInput").value.trim();
    if(!CLS) return toast("반을 골라 주세요");
    if(!S.group) return toast("모둠을 골라 주세요");
    if(!name) return toast("이름을 입력해 주세요");
    if(!code && !UNLOCK_ALL) return toast("반 입장 코드를 입력해 주세요");
    App.busy = true;
    try{
      // 확인용 화면에서는 입장 코드를 건너뛰어요
      if(!UNLOCK_ALL && code !== CLASS_CODE[CLS]) return toast(`${CLS}반 입장 코드가 아니에요`);
      const g = await DB.get("g"+S.group);
      if(!(g.pins||{})[name]){       // 처음 온 이름이면 오타인지 한 번 확인해요
        const ok = await ask(`${CLS}반 ${S.group}모둠에 '${name}'(으)로 처음 들어왔어요. 이름이 맞나요?`);
        if(!ok) return;
        await DB.update("g"+S.group, d => { (d.pins ||= {})[name] = 1; });
      }
    } finally { App.busy = false; }
    S.name = name;
    try{ localStorage.setItem(ROOT+"_me", JSON.stringify({cls:CLS, group:S.group, name, code})); }catch(e){}
    $("#login").classList.add("hidden");
    $("#studentApp").classList.remove("hidden");
    $("#meInfo").innerHTML = `<b>${CLS}반 ${S.group}모둠</b> · ${esc(name)} <button class="btn ghost sm" style="margin-left:6px" onclick="location.reload()">나가기</button>`;
    // 실시간으로 받는 것은 '설정 1개 + 우리 모둠 1개' 뿐
    DB.watch("settings", d => {
      const pv = S.view, first = !S.ready; S.ready = true;
      S.stage = UNLOCK_ALL ? 4 : (d.stage || 1); S.lock = !!d.lock;
      if(S.view > S.stage) S.view = S.stage;
      renderSteps();
      if(first || pv!==S.view) render(); else V.refresh();   // 작업 중인 화면은 다시 그리지 않아요
    });
    DB.watch("v"+S.group, d => { S.vdata = {items:d.items||{}, ground:d.ground||{}, likes:d.likes||{}}; V.refresh(); });
    DB.watch("g"+S.group, d => { S.gdata = {notes:d.notes||[], buildings:d.buildings||[], designs:d.designs||{}, imgs:d.imgs||{}, concept:d.concept||null};
      if(S.view===1 && S.sub!=="gallery") render();
      if(S.view===4 && V.mode===0){ V.refresh(); ensureImgs(S.group, S.gdata.imgs).then(ch => { if(ch) V.refresh(); }); }
    });
  },

  go(n){ if(n > S.stage) return toast("아직 열리지 않은 단계예요"); V.flush(); S.view = n; renderSteps(); render(); },
  sub(s){ S.sub = s; render(); },
  filter(f){ S.filter = f; render(); },

  /* ----- 카드 모달 ----- */
  openCard(id){
    const c = CARDS.find(x=>x.id===id);
    const m = loadMemos()[id] || {};
    $("#modalRoot").innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)App.closeModal()">

          <h2>${esc(c.title)}</h2>
          ${tagHTML(c.tags)}
          <p>${esc(c.desc)}</p>
          <div class="real">📍 실제 사례: ${esc(c.real)}</div>
          <div class="q">🤔 ${esc(c.q)}</div>
        </div>
        <div class="right">
          <div><button class="close-x" onclick="App.closeModal()">✕</button><h3>📝 나의 생각</h3></div>

          <textarea id="mProblem" placeholder="예) 홍수가 나도 집이 잠기지 않게 해 줘요">${esc(m.problem||"")}</textarea>

          </div>
        </div>
      </div>
    </div>`;
  },
  closeModal(){ $("#modalRoot").innerHTML = ""; if(S.view===1 && S.sub==="gallery") render(); },
  saveMemo(id, silent){
    const memos = loadMemos();
    memos[id] = { problem: $("#mProblem").value.trim(), use: $("#mUse").value.trim() };
    saveMemos(memos);
    if(!silent) toast("메모를 저장했어요");
    return memos[id];
  },
  async sendNote(id){
    const m = App.saveMemo(id, true);
    if(!m.problem && !m.use) return toast("생각을 먼저 적어 주세요");
    const c = CARDS.find(x=>x.id===id);
    const note = { id:uid(), by:S.name, cardId:id, cardTitle:c.title, cat:c.tags[0], problem:m.problem, use:m.use, hearts:[], t:Date.now() };
    await DB.update("g"+S.group, d => { (d.notes ||= []).push(note); });
    toast("모둠 보드로 보냈어요 ✨");
    App.closeModal();
  },

  /* ----- 자유 아이디어 ----- */
  openFree(){
    $("#modalRoot").innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)App.closeModal()">
      <div class="modal" style="grid-template-columns:1fr;width:min(520px,100%)">
        <div class="right" style="background:#fff">
          <div><button class="close-x" onclick="App.closeModal()">✕</button><h3>💡 새 아이디어 쓰기</h3></div>
          <label>어느 칸에 붙일까요?</label>
          <select id="fCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.icon} ${v.name}</option>`).join("")}</select>
          <label>아이디어</label>
          <textarea id="fText" placeholder="예) 태양광 지붕 아래에서 채소를 기르는 학교"></textarea>
          <div class="row"><button class="btn" style="width:100%" onclick="App.sendFree()">보드에 붙이기</button></div>
        </div>
      </div>
    </div>`;
  },
  async sendFree(){
    const text = $("#fText").value.trim(); if(!text) return toast("아이디어를 적어 주세요");
    const note = { id:uid(), by:S.name, cardId:"", cardTitle:"", cat:$("#fCat").value, idea:text, hearts:[], t:Date.now() };
    await DB.update("g"+S.group, d => { (d.notes ||= []).push(note); });
    toast("보드에 붙였어요"); App.closeModal(); render();
  },

  async sendCause(){
    const el = $("#causeInput"); const text = el.value.trim();
    if(!text) return toast("이유를 적어 주세요");
    el.value = "";
    const note = { id:uid(), by:S.name, cardId:"", cardTitle:"", cat:"cause", idea:text, hearts:[], t:Date.now() };
    await DB.update("g"+S.group, d => { (d.notes ||= []).push(note); });
    toast("붙였어요");
  },

  async heart(noteId){
    await DB.update("g"+S.group, d => {
      const n = (d.notes||[]).find(x=>x.id===noteId); if(!n) return;
      n.hearts ||= [];
      n.hearts = n.hearts.includes(S.name) ? n.hearts.filter(x=>x!==S.name) : [...n.hearts, S.name];
    });
  },
  async delMyNote(noteId){
    if(!await ask("내 포스트잇을 지울까요?")) return;
    await DB.update("g"+S.group, d => { d.notes = (d.notes||[]).filter(x=>!(x.id===noteId && x.by===S.name)); });
  },

  /* ----- 마을 컨셉 ----- */
  editConcept(on){ D1.editConcept = on; render(); },
  async saveConcept(){
    const v = id => ($("#"+id)?.value || "").trim();
    const c = { name:v("cName"), theme:v("cTheme"), desc:v("cDesc"), by:S.name };
    if(!c.name) return toast("마을 이름을 적어 주세요");
    if(!c.theme) return toast("마을 컨셉을 한 줄로 적어 주세요");
    if(!c.desc) return toast("마을 설명을 적어 주세요");
    ["cName","cTheme","cDesc"].forEach(id => { const el = $("#"+id); if(el) el.value = ""; });
    D1.editConcept = false;
    await DB.update("g"+S.group, d => { d.concept = c; });
    toast("마을 컨셉을 저장했어요 🌱");
  },

  /* ----- 건물 목록 ----- */
  pickCat(btn){
    btn.classList.toggle("on");
    const k = btn.dataset.k;
    btn.style.background = btn.classList.contains("on") ? CATS[k].hex : "";
    btn.style.color = btn.classList.contains("on") ? "#fff" : "";
  },
  async addBuilding(){
    const name = $("#bName").value.trim();
    const desc = $("#bDesc").value.trim();
    const owner = $("#bOwner").value.trim();
    const cats = [...document.querySelectorAll(".catpick button.on")].map(b=>b.dataset.k);
    if(!S.gdata.concept) return toast("먼저 마을 컨셉을 저장해 주세요");
    if(!name) return toast("건물 이름을 적어 주세요");
    if(!cats.length) return toast("분류를 하나 이상 골라 주세요");
    ["bName","bDesc","bOwner"].forEach(id => $("#"+id).value = "");
    document.querySelectorAll(".catpick button.on").forEach(b => App.pickCat(b));
    await DB.update("g"+S.group, d => { (d.buildings ||= []).push({ id:uid(), name, desc, owner, cats, by:S.name }); });
    toast("목록에 추가했어요");
  },
  async claim(bid){
    await DB.update("g"+S.group, d => { const b=(d.buildings||[]).find(x=>x.id===bid); if(b) b.owner = (b.owner===S.name? "" : S.name); });
  },
  async delBuilding(bid){
    if(!await ask("이 건물을 목록에서 지울까요?")) return;
    await DB.update("g"+S.group, d => { d.buildings = (d.buildings||[]).filter(x=>x.id!==bid); });
  },

  /* ----- 2단계 ----- */
  updPrompt(){
    const box = document.getElementById("dPrompt"); if(!box) return;
    const d = readDesign();
    box.textContent = buildPrompt(d, D2.withSketch);
    const miss = missingOf(d), st = document.getElementById("dStatus");
    st.className = "status " + (miss.length?"no":"ok");
    st.textContent = miss.length ? `아직: ${miss.join(", ")}` : "✅ 완성!";
  },
  sketchMode(on){
    const d = readDesign();
    D2.withSketch = on;
    S.gdata.designs[S.name] = { ...(S.gdata.designs[S.name]||{}), ...d };  // 화면 다시 그릴 때 입력 유지
    render();
  },
  async saveDesign(){
    const d = readDesign();
    if(!d.name) return toast("건물 이름을 적어 주세요");
    d.t = Date.now();
    await DB.update("g"+S.group, g => { (g.designs ||= {})[S.name] = d; });
    const miss = missingOf(d);
    toast(miss.length ? `저장했어요 (아직: ${miss.join(", ")})` : "설계 카드를 저장했어요 ✅");
  },
  async copyPrompt(){
    const text = document.getElementById("dPrompt").textContent;
    try{ await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove();
    }
    toast("주문서를 복사했어요 📋");
  },

  /* ----- 교사 ----- */
  async teacherLogin(){
    if(!CLS) return toast("먼저 위에서 반을 골라 주세요");
    const pw = await dialog(`${CLS}반 선생님 비밀번호`, true);
    if(pw !== TEACHER_PW) { if(pw!==null) toast("비밀번호가 달라요"); return; }
    $("#teacherApp .logo").textContent = `🌱 그린 아크 프로젝트 · ${CLS}반 선생님`;
    $("#login").classList.add("hidden");
    $("#teacherApp").classList.remove("hidden");
    T.init();
  },
};
window.App = App;

function renderSteps(){
  $("#steps").innerHTML = STEPS.map(s => {
    const cls = s.n===S.view ? "on" : (s.n > S.stage ? "lock" : "");
    return `<button class="step ${cls}" onclick="App.go(${s.n})">${s.n > S.stage ? "🔒" : s.icon} ${s.n}. ${s.name}</button>`;
  }).join("");
}

function render(){
  const m = $("#studentMain");
  // 다른 모둠원의 변경으로 화면이 다시 그려져도 입력 중인 내용은 유지
  const keep = {};
  ["bName","bDesc","bOwner","causeInput","cName","cTheme","cDesc"].forEach(id => { const el = document.getElementById(id); if(el) keep[id] = el.value; });
  const picked = [...document.querySelectorAll(".catpick button.on")].map(b=>b.dataset.k);
  const focusId = document.activeElement?.id;
  try{ return renderInner(m); } finally {
    Object.entries(keep).forEach(([id,v]) => { const el = document.getElementById(id); if(el) el.value = v; });
    picked.forEach(k => { const b = document.querySelector(`.catpick button[data-k="${k}"]`); if(b) App.pickCat(b); });
    if(focusId){ const el = document.getElementById(focusId); if(el) el.focus(); }
  }
}
function renderInner(m){
  if(S.view===1) m.innerHTML = renderStep1();
  else if(S.view===2){ m.innerHTML = renderStep2(); App.updPrompt(); }
  else if(S.view===3){ m.innerHTML = renderStep3(); B.mount(); }
  else { m.innerHTML = V.html(); V.mount(); }
}

/* ---------- 1단계: 탐색 ---------- */
function renderStep1(){
  const tabs = `
  <div class="subtabs">
    <button class="subtab ${S.sub==="gallery"?"on":""}" onclick="App.sub('gallery')">🖼️ 사례 갤러리</button>
    <button class="subtab ${S.sub==="board"?"on":""}" onclick="App.sub('board')">🗒️ 우리 모둠 보드 (${S.gdata.notes.length})</button>
    <button class="subtab ${S.sub==="list"?"on":""}" onclick="App.sub('list')">🏘️ 우리 마을 설계 (${S.gdata.buildings.length})</button>
  </div>`;
  if(S.sub==="gallery") return tabs + renderGallery();
  if(S.sub==="board")   return tabs + renderBoard();
  return tabs + renderList();
}

function renderGallery(){
  const memos = loadMemos();
  const list = S.filter==="all" ? CARDS : CARDS.filter(c=>c.tags.includes(S.filter));
  const chip = (k,label,color) => `<button class="chip ${S.filter===k?"on":""}" style="${S.filter===k?`background:${color}`:""}" onclick="App.filter('${k}')">${label}</button>`;
  return `
  <div class="guide">🔍 <b>기후가 바뀌어 지금처럼 살 수 없게 된다면, 우리 마을에는 무엇이 있어야 할까?</b><br>
  카드를 눌러 살펴보고, 떠오른 생각을 적어 <b>모둠 보드로 보내 보세요.</b></div>
  <div class="chips">
    ${chip("all","전체 보기","var(--main)")}

  <div class="cards">
    ${list.map(c=>`
      <div class="card" onclick="App.openCard('${c.id}')">

        <img class="pic" src="${picOf(c)}" alt="">
        <div class="body">${tagHTML(c.tags)}<h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="real sm">📍 ${esc(c.real)}</div></div>
      </div>`).join("")}
  </div>`;
}

const byHeart = (a,b)=>(b.hearts?.length||0)-(a.hearts?.length||0);
function noteHTML(n){
  return `
  <div class="note">
    <div class="from">${esc(n.by)}${n.cat==="cause"?"":(n.cardTitle?` · 📌 ${esc(n.cardTitle)}`:" · 💡 새 아이디어")}</div>
    ${n.idea ? esc(n.idea) : ""}
    ${n.problem ? `<div><span class="k">해결:</span> ${esc(n.problem)}</div>`:""}
    ${n.use ? `<div><span class="k">우리 마을:</span> ${esc(n.use)}</div>`:""}
    <div class="foot">
      <button class="heart ${n.hearts?.includes(S.name)?"on":""}" onclick="App.heart('${n.id}')">❤️ ${n.hearts?.length||0}</button>
      ${n.by===S.name?`<button style="background:none;color:var(--sub);font-size:12px" onclick="App.delMyNote('${n.id}')">지우기</button>`:""}
    </div>
  </div>`;
}
function renderBoard(){
  const notes = S.gdata.notes;
  const causes = notes.filter(n=>n.cat==="cause").sort(byHeart);
  const col = (k) => {
    const v = CATS[k];
    const items = notes.filter(n=>n.cat===k).sort(byHeart);
    return `
    <div class="col" style="border-color:${v.color}">
      <h3>${v.icon} ${v.name} <small>${items.length}장</small></h3>
      ${items.map(noteHTML).join("") || `<p style="color:var(--sub);font-size:13px;padding:6px">아직 없어요</p>`}
    </div>`;
  };
  return `
  <div class="cause">
    <h3>🌍 기후 난민은 왜 생길까? <small style="font-family:'Noto Sans KR';font-size:12px;color:var(--sub)">${causes.length}장</small></h3>
    <div class="hint">기후가 바뀌면서 사람들이 살던 곳을 떠나야 하는 이유를 생각해 적어 보세요. (힌트: 바다, 비, 가뭄, 더위, 농사, 물…)</div>
    <div class="write">
      <input id="causeInput" maxlength="80" placeholder="예) 바닷물이 높아져서 섬이 물에 잠기기 때문에" onkeydown="if(event.key==='Enter')App.sendCause()">
      <button class="btn" onclick="App.sendCause()">붙이기</button>
    </div>
    <div class="notes">${causes.map(noteHTML).join("") || `<p style="color:var(--sub);font-size:13px">아직 없어요</p>`}</div>
  </div>
  <div class="board-top">
    <div class="guide" style="margin:0;flex:1">🗣️ 그렇다면 어떻게 해결할 수 있을까요? 모둠원의 생각을 읽고 <b>좋은 아이디어에 ❤️</b>를 눌러 주세요. 이야기를 나눈 뒤 활동지에 정리해 보세요.</div>
    <button class="btn" onclick="App.openFree()">💡 새 아이디어 쓰기</button>
  </div>
  <div class="board">${Object.keys(CATS).map(col).join("")}</div>`;
}

const D1 = { editConcept:false };   // 화면 상태(저장 안 함)

const IMG = {}, IMGP = {};
const imgDocId = (g,name) => `img_g${g}_${String(name).replace(/\//g,"_")}`;
async function ensureImgs(g, map){
  let changed = false;
  await Promise.all(Object.entries(map||{}).map(async ([name,t]) => {
    const k = g+"|"+name;
    if(IMG[k] && IMG[k].t===t) return;
    const pk = k+"|"+t;
    IMGP[pk] ||= DB.get(imgDocId(g,name));
    const d = await IMGP[pk];
    if(d && d.data){ IMG[k] = {t, data:d.data, w:d.w, h:d.h}; changed = true; }
  }));
  return changed;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){ } ta.remove(); }
}
const bNameOf = (c, who) => c.designs?.[who]?.name || c.buildings?.find(b=>b.owner===who)?.name || who;

const B = {

  fromURL(url, done){
    const im = new Image();

      const k = Math.min(1, 640/Math.max(im.width, im.height));
      E.w = Math.max(1, Math.round(im.width*k)); E.h = Math.max(1, Math.round(im.height*k));

      const x = c.getContext("2d"); x.drawImage(im, 0, 0, E.w, E.h);
      E.orig = x.getImageData(0, 0, E.w, E.h).data; E.undo = [];
      done && done();
      B.auto(); B.showEditor();

  // 가장자리에서 시작해 배경색과 비슷한 곳만 지워요 (건물 안의 흰 벽은 남아요)
  auto(){
    const {w,h,orig:o} = E, n = w*h, m = new Uint8Array(n).fill(255), tol = E.tol;
    const cs = [0, w-1, (h-1)*w, n-1]; let r=0,g=0,b=0;
    cs.forEach(i => { r+=o[i*4]; g+=o[i*4+1]; b+=o[i*4+2]; }); r/=4; g/=4; b/=4;
    const bg = i => o[i*4+3] < 12 || Math.max(Math.abs(o[i*4]-r), Math.abs(o[i*4+1]-g), Math.abs(o[i*4+2]-b)) <= tol;
    const st = [];
    const push = i => { if(m[i]===255 && bg(i)){ m[i]=0; st.push(i); } };
    for(let x=0;x<w;x++){ push(x); push((h-1)*w+x); }
    for(let y=0;y<h;y++){ push(y*w); push(y*w+w-1); }
    while(st.length){
      const i = st.pop(), x = i%w;
      if(x>0) push(i-1); if(x<w-1) push(i+1); if(i>=w) push(i-w); if(i<n-w) push(i+w);
    }
    for(let i=0;i<n;i++){            // 경계 부드럽게
      if(m[i]!==255) continue; const x = i%w;
      if((x>0&&m[i-1]===0)||(x<w-1&&m[i+1]===0)||(i>=w&&m[i-w]===0)||(i<n-w&&m[i+w]===0)) m[i]=140;
    }
    E.mask = m;
  },
  setTol(v){ E.tol = v; if(!E.orig) return; E.undo.push(E.mask); B.auto(); B.draw(); },
  tool(t){ E.tool = t; document.querySelectorAll(".tools .tg[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t===t)); },
  undo(){ const m = E.undo.pop(); if(!m) return toast("되돌릴 것이 없어요"); E.mask = m; B.draw(); },
  showEditor(){
    const c = $("#bCanvas"); if(!c) return;
    $("#bEmpty").classList.add("hidden"); $("#bEdit").classList.remove("hidden");
    c.width = E.w; c.height = E.h; B.draw();
    let last = null;
    const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX-r.left)*E.w/r.width, (e.clientY-r.top)*E.h/r.height, E.w/r.width]; };
    const dab = (x,y,rad) => {
      const v = E.tool==="erase" ? 0 : 255, r2 = rad*rad;
      for(let yy=Math.max(0,Math.floor(y-rad)); yy<=Math.min(E.h-1,Math.ceil(y+rad)); yy++)
        for(let xx=Math.max(0,Math.floor(x-rad)); xx<=Math.min(E.w-1,Math.ceil(x+rad)); xx++)
          if((xx-x)*(xx-x)+(yy-y)*(yy-y) <= r2) E.mask[yy*E.w+xx] = v;
    };
    const stroke = e => {
      const [x,y,k] = pos(e), rad = E.size*k/2;
      if(last){ const d = Math.hypot(x-last[0], y-last[1]), n = Math.max(1, Math.ceil(d/(rad/2||1)));
        for(let i=1;i<=n;i++) dab(last[0]+(x-last[0])*i/n, last[1]+(y-last[1])*i/n, rad); }
      else dab(x,y,rad);
      last = [x,y]; B.draw();
    };
    c.onpointerdown = e => { c.setPointerCapture(e.pointerId); E.undo.push(E.mask.slice()); if(E.undo.length>12) E.undo.shift(); last=null; E.down=true; stroke(e); };
    c.onpointermove = e => { if(E.down) stroke(e); };
    c.onpointerup = c.onpointercancel = () => { E.down=false; last=null; };
  },
  draw(){
    const c = $("#bCanvas"); if(!c || !E.orig) return;
    const id = new ImageData(new Uint8ClampedArray(E.orig), E.w, E.h), p = id.data, m = E.mask;
    for(let i=0;i<m.length;i++) p[i*4+3] = p[i*4+3]*m[i]/255;
    c.getContext("2d").putImageData(id, 0, 0);
  },
  async save(){
    if(!E.orig) return;
    const {w,h,mask:m} = E; let x0=w, y0=h, x1=-1, y1=-1;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(m[y*w+x]>40 && E.orig[(y*w+x)*4+3]>40){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    if(x1<0) return toast("남은 그림이 없어요");
    const cw = x1-x0+1, ch = y1-y0+1, src = $("#bCanvas");
    const make = max => { const k = Math.min(1, max/Math.max(cw,ch)), c = document.createElement("canvas");
      c.width = Math.max(1,Math.round(cw*k)); c.height = Math.max(1,Math.round(ch*k));
      c.getContext("2d").drawImage(src, x0, y0, cw, ch, 0, 0, c.width, c.height);
      let u = c.toDataURL("image/webp", 0.85); if(!u.startsWith("data:image/webp")) u = c.toDataURL("image/png");
      return {data:u, w:c.width, h:c.height}; };
    let out = make(380); if(out.data.length > 600000) out = make(260); if(out.data.length > 600000) out = make(180);
    const t = Date.now();
    await DB.update(imgDocId(S.group, S.name), d => { Object.assign(d, out, {by:S.name, t}); });
    await DB.update("g"+S.group, g => { (g.imgs ||= {})[S.name] = t; });
    IMG[S.group+"|"+S.name] = {t, ...out}; S.gdata.imgs[S.name] = t;
    toast("건물을 저장했어요 ✅"); B.showSaved();
  },
};

          x.strokeStyle = "#5d6168"; x.lineWidth = 2;   x.beginPath(); x.moveTo(cx-dx/2+px*q, my-dy/2+py*q); x.lineTo(cx+dx/2+px*q, my+dy/2+py*q); x.stroke(); } };
        if(alongI || !alongJ) rail(TW/2, TH/2, -TW/2, TH/2);
        if(alongJ) rail(-TW/2, TH/2, TW/2, TH/2);
      }
      if(t==="h"){   // 얕은 물: 밝은 물빛 + 바닥 모래 점
        x.fillStyle = "rgba(240,220,160,.75)"; for(const [a,b] of [[-14,16],[6,9],[14,18],[-2,22]]){ x.beginPath(); x.arc(cx+a, cy+b, 1.8, 0, 7); x.fill(); }
        x.strokeStyle = "rgba(255,255,255,.7)"; x.lineWidth = 1.2; x.beginPath(); x.moveTo(cx-6,cy+12); x.quadraticCurveTo(cx-2,cy+9,cx+2,cy+12); x.stroke();
      }
      if(t==="w"||t==="d"||t==="k"){ x.strokeStyle = "rgba(255,255,255,.55)"; x.lineWidth = 1.5; x.beginPath(); x.moveTo(cx-10,cy+15); x.quadraticCurveTo(cx-5,cy+11,cx,cy+15); x.quadraticCurveTo(cx+5,cy+19,cx+10,cy+15); x.stroke(); }
    }
    // 두 번째로: 물 위에 기둥으로 띄운 나무 다리·데크 (앞쪽 칸이 나중에 그려지도록 대각선 순서로)
    const tiles = [];
    for(let i=0;i<TN;i++) for(let j=0;j<TN;j++){ const t = c.ground[i+"_"+j]; if(t==="d"||t==="k") tiles.push([i,j,t]); }
    tiles.sort((a,b) => (a[0]+a[1])-(b[0]+b[1]));
    const UP = 5;    // 물 위로 떠 있는 높이
    const poly = (pts, fill) => { x.fillStyle = fill; x.beginPath(); pts.forEach(([a,b],n)=> n?x.lineTo(a,b):x.moveTo(a,b)); x.closePath(); x.fill(); };
    const post = (a,b) => { x.fillStyle = "#4e3319"; x.fillRect(a-1.6, b-1, 3.2, UP+6); x.fillStyle = "rgba(255,255,255,.5)"; x.fillRect(a-3, b+UP+4, 6, 1.2); };
    const isWood = (a,b) => { const g = c.ground[a+"_"+b]; return g==="d"||g==="k"; };
    const isLand = (a,b) => { if(a<0||b<0||a>=TN||b>=TN) return false; const g = c.ground[a+"_"+b] || "g"; return !"whdk".includes(g); };
    for(const [i,j,t] of tiles){
      const cx = OX+(i-j)*TW/2, my = OY+(i+j)*TH/2 + TH/2 - UP;
      if(t==="k"){   // 수상 데크: 칸 전체를 덮는 나무 바닥
        const s = 1, L=[cx-TW/2*s,my], B=[cx,my+TH/2*s], R=[cx+TW/2*s,my], T=[cx,my-TH/2*s];
        [L,B,R].forEach(([a,b]) => post(a + (a<cx?3:a>cx?-3:0), b - (b>my?2:0)));
        poly([L,B,[B[0],B[1]+3],[L[0],L[1]+3]], "#7a5130"); poly([B,R,[R[0],R[1]+3],[B[0],B[1]+3]], "#6a4527");
        poly([L,B,R,T], "#c58d55");
        x.strokeStyle = "#9c6a3c"; x.lineWidth = 1;
        for(let q=-.75;q<=.76;q+=.25){ x.beginPath(); x.moveTo(cx-TW/4*s+q*TW/4*s, my-TH/4*s-q*TH/4*s); x.lineTo(cx+TW/4*s+q*TW/4*s, my+TH/4*s-q*TH/4*s); x.stroke(); }
        continue;
      }
      // 나무 다리: 이어진 다리·데크 방향을 따라가요. 없으면 붙어 있는 땅 쪽으로 놓여요.
      let alongI = isWood(i-1,j)||isWood(i+1,j), alongJ = isWood(i,j-1)||isWood(i,j+1);
      if(!alongI && !alongJ){ alongI = isLand(i-1,j)||isLand(i+1,j); alongJ = !alongI && (isLand(i,j-1)||isLand(i,j+1)); }
      if(!alongI && !alongJ) alongI = true;
      const plank = (dx,dy,px,py) => {
        const w = .24, a=[cx-dx/2+px*w, my-dy/2+py*w], b=[cx+dx/2+px*w, my+dy/2+py*w], c2=[cx+dx/2-px*w, my+dy/2-py*w], d=[cx-dx/2-px*w, my-dy/2-py*w];
        const lowA = a[1]>d[1] ? [a,b] : [d,c2];       // 앞쪽(아래) 모서리에 두께와 기둥
        post(cx + (lowA[0][0]+lowA[1][0]-2*cx)*.35 - dx*.2, (lowA[0][1]+lowA[1][1])/2 - dy*.2);
        post(cx + (lowA[0][0]+lowA[1][0]-2*cx)*.35 + dx*.2, (lowA[0][1]+lowA[1][1])/2 + dy*.2);
        poly([lowA[0],lowA[1],[lowA[1][0],lowA[1][1]+3],[lowA[0][0],lowA[0][1]+3]], "#6a4527");
        poly([a,b,c2,d], "#c58d55");
        x.strokeStyle = "#8f5f34"; x.lineWidth = 1.1;
        for(let q=1;q<6;q++){ const f = q/6; x.beginPath(); x.moveTo(a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f); x.lineTo(d[0]+(c2[0]-d[0])*f, d[1]+(c2[1]-d[1])*f); x.stroke(); }
      };
      if(alongI) plank(TW/2, TH/2, -TW/2, TH/2);
      if(alongJ) plank(-TW/2, TH/2, TW/2, TH/2);
    }
  },
  drawItems(c){
    V.itemsEl.innerHTML = Object.entries(c.items).map(([id,it]) => {
      let src, w, label = "", sh = false;
      if(it.k==="b"){ const im = IMG[c.g+"|"+it.r]; if(!im) return ""; src = im.data; w = 170*it.s;
        label = bNameOf(c, it.r); }
      else { const p = PROP[it.r]; if(!p) return ""; src = p.src; w = p.w*it.s; sh = !p.ns; }
      return `<div class="vi ${V.sel===id?"sel":""}" data-id="${esc(id)}" style="left:${it.x}px;top:${it.y}px;z-index:${Math.round(it.y)}">
        ${sh ? `<i class="sh" style="width:${w*.8}px;height:${w*.2}px"></i>` : ""}
        <img draggable="false" src="${src}" alt="" style="width:${w}px;left:${-w/2}px;${it.f?"transform:scaleX(-1)":""}">
        ${label && V.labels ? `<span class="lb">${esc(label)}</span>` : ""}</div>`;
    }).join("");
  },
  drawSide(c){
    const el = $("#vSide"); if(!el) return;
    const names = Object.keys(c.imgs||{});
    const cc = c.concept, con = cc ? `<div class="vconcept"><b>${esc(cc.name)}</b><div class="theme">💡 ${esc(cc.theme)}</div>${V.mode?`<p>${esc(cc.desc)}</p>`:""}</div>` : "";
    const tray = `<h4>🏠 ${V.mode?V.mode+"모둠":"우리 모둠"} 건물</h4><div class="vtray">${names.map((n,i)=>{
      const placed = !!c.items["b_"+n], im = IMG[c.g+"|"+n];
      return `<button onclick="V.trayTap(${i})">${im?`<img src="${im.data}" alt="">`:""}<span>${esc(bNameOf(c,n))}<small>${esc(n)} · ${placed?"놓여 있음":"아직 안 놓음"}</small></span></button>`;
    }).join("") || `<p style="font-size:13px;color:var(--sub)">아직 저장된 건물이 없어요${V.mode?"":" (3단계에서 저장)"}</p>`}</div>`;
    V.trayNames = names;
    if(!c.edit){ el.innerHTML = con + tray; return; }
    el.innerHTML = con + `
      <h4>🖐️ 도구</h4>
      <div class="vtools"><button class="${V.tool==="move"?"on":""}" style="grid-column:1/3" onclick="V.setTool('move')">✋ 고르기·옮기기</button>
      ${Object.entries(GROUND).map(([k,[e,n]])=>`<button class="${V.tool===k?"on":""}" onclick="V.setTool('${k}')">${e} ${n}</button>`).join("")}</div>
      <p style="font-size:12px;color:var(--sub);margin-top:6px">땅 종류를 고르고 땅을 문지르면 칠해져요.</p>
      ${tray}
      <h4>🌳 소품 (누르면 추가)</h4>
      <div class="vprops">${PROPS.map(p=>`<button title="${p.name}" onclick="V.addProp('${p.id}')"><img src="${p.src}" alt="${p.name}"></button>`).join("")}</div>`;
  },
  drawBar(c){
    const el = $("#vBar"); if(!el) return;
    const it = V.sel && c.edit ? c.items[V.sel] : null;
    el.classList.toggle("hidden", !it); if(!it) return;
    const nm = it.k==="b" ? bNameOf(c, it.r) : PROP[it.r]?.name;
    el.innerHTML = `<span class="nm">${esc(nm||"")}</span>
      <button onclick="V.act('l')">◀</button><button onclick="V.act('u')">▲</button><button onclick="V.act('d')">▼</button><button onclick="V.act('r')">▶</button><span class="sep"></span>
      <button onclick="V.act('-')" title="작게">➖</button><button onclick="V.act('+')" title="크게">➕</button><button onclick="V.act('f')" title="좌우 뒤집기">↔️</button><span class="sep"></span>
      <button onclick="V.act('x')" title="${it.k==="b"?"마을에서 치우기":"지우기"}">🗑️</button>`;
  },
  /* ----- 화면 이동·확대 ----- */
  applyT(){ V.world.style.transform = `translate(${V.tx}px,${V.ty}px) scale(${V.z})`; },
  fit(){ const r = V.port.getBoundingClientRect(); V.z = Math.min(r.width/VW, r.height/VH) || .5; V.minZ = V.z*.7; V.tx = (r.width-VW*V.z)/2; V.ty = (r.height-VH*V.z)/2; V.applyT(); },
  zoomAt(px, py, nz){ nz = clamp(nz, V.minZ, 3); V.tx = px-(px-V.tx)*nz/V.z; V.ty = py-(py-V.ty)*nz/V.z; V.z = nz; V.applyT(); },
  zoomBy(f){ const r = V.port.getBoundingClientRect(); V.zoomAt(r.width/2, r.height/2, V.z*f); },
  toggleLabels(){ V.labels = !V.labels; V.refresh(); },
  toWorld(e){ const r = V.port.getBoundingClientRect(); return [(e.clientX-r.left-V.tx)/V.z, (e.clientY-r.top-V.ty)/V.z]; },
  centerWorld(){ const r = V.port.getBoundingClientRect(); return [clamp((r.width/2-V.tx)/V.z + (Math.random()-.5)*70, 40, VW-40), clamp((r.height/2-V.ty)/V.z + (Math.random()-.5)*50, OY, VH-40)]; },
  lookAt(it){ const r = V.port.getBoundingClientRect(); V.tx = r.width/2-it.x*V.z; V.ty = r.height/2-(it.y-40)*V.z; V.applyT(); },
  /* ----- 손가락/마우스 ----- */
  down(e){
    if(e.target.closest(".vzoom,.vbar")) return;
    V.port.setPointerCapture(e.pointerId);
    V.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(V.ptrs.size===2){
      V.endAct(true);
      const [p,q] = [...V.ptrs.values()], r = V.port.getBoundingClientRect();
      V.pinch = { d:Math.hypot(p.x-q.x, p.y-q.y)||1, z:V.z, tx:V.tx, ty:V.ty, mx:(p.x+q.x)/2-r.left, my:(p.y+q.y)/2-r.top };
      return;
    }
    const c = V.ctx(), el = e.target.closest(".vi"), base = { sx:e.clientX, sy:e.clientY, tx:V.tx, ty:V.ty, moved:false };
    if(el && c.edit && V.tool==="move"){
      const id = el.dataset.id, it = c.items[id]; if(!it) return;
      if(V.sel!==id){ V.sel = id; V.drawItems(c); V.drawBar(c); }
      V.a = { ...base, type:"drag", id, it:{...it}, el:[...V.itemsEl.children].find(x=>x.dataset.id===id) };
    }
    else if(el && !c.edit) V.a = { ...base, type:"tap", id:el.dataset.id };
    else if(c.edit && V.tool!=="move"){ V.a = { ...base, type:"paint", ch:{} }; V.paint(V.toWorld(e)); }
    else V.a = { ...base, type:"pan" };
  },
  move(e){
    const p = V.ptrs.get(e.pointerId); if(!p) return; p.x = e.clientX; p.y = e.clientY;
    if(V.pinch){
      if(V.ptrs.size<2) return;
      const [a,b] = [...V.ptrs.values()], r = V.port.getBoundingClientRect(), k = V.pinch;
      const nz = clamp(k.z*Math.hypot(a.x-b.x, a.y-b.y)/k.d, V.minZ, 3), mx = (a.x+b.x)/2-r.left, my = (a.y+b.y)/2-r.top;
      V.tx = mx-(k.mx-k.tx)*nz/k.z; V.ty = my-(k.my-k.ty)*nz/k.z; V.z = nz; V.applyT(); return;
    }
    const a = V.a; if(!a) return;
    const dx = e.clientX-a.sx, dy = e.clientY-a.sy;
    if(Math.abs(dx)+Math.abs(dy) > 6) a.moved = true;
    if(a.type==="drag"){
      if(!a.moved) return;
      const o = V.ctx().items[a.id] || a.it;
      if(!a.x0){ a.x0 = a.it.x; a.y0 = a.it.y; }
      a.it.x = Math.round(clamp(a.x0+dx/V.z, 20, VW-20)); a.it.y = Math.round(clamp(a.y0+dy/V.z, 40, VH-10));
      V.local[a.id] = a.it;
      if(a.el){ a.el.style.left = a.it.x+"px"; a.el.style.top = a.it.y+"px"; a.el.style.zIndex = a.it.y; }
    }
    else if(a.type==="paint") V.paint(V.toWorld(e));
    else if(a.moved){ V.tx = a.tx+dx; V.ty = a.ty+dy; V.applyT(); }
  },
  up(e){
    if(!V.ptrs.delete(e.pointerId)) return;
    if(V.pinch){ if(V.ptrs.size<2) V.pinch = null; return; }
    V.endAct(false);
  },
  endAct(cancel){
    const a = V.a; V.a = null; if(!a) return;
    if(a.type==="drag"){ if(a.moved) V.saveItem(a.id); if(V.dirty){ V.dirty = false; V.refresh(); } }
    else if(a.type==="paint") V.saveGround(a.ch);
    else if(a.type==="pan"){ if(!a.moved && !cancel && V.sel){ V.sel = null; V.refresh(); } }
    else if(a.type==="tap"){ if(!a.moved && !cancel) V.card(a.id); }
  },
  /* ----- 땅 칠하기 ----- */
  paint([x,y]){
    const u = (x-OX)/(TW/2), v = (y-OY)/(TH/2), i = Math.floor((u+v)/2), j = Math.floor((v-u)/2);
    if(i<0 || j<0 || i>=TN || j>=TN) return;
    const k = i+"_"+j, c = V.ctx(); if((c.ground[k]||"g")===V.tool) return;
    V.localGround[k] = V.tool; V.a.ch[k] = V.tool; c.ground[k] = V.tool; V.drawGround(c);
  },
  async saveGround(ch){
    if(!Object.keys(ch).length) return;
    const put = g => { for(const [k,t] of Object.entries(ch)){ if(t==="g") delete g[k]; else g[k] = t; } };
    await DB.update("v"+S.group, d => { put(d.ground ||= {}); });
    put(S.vdata.ground ||= {});
    for(const [k,t] of Object.entries(ch)) if(V.localGround[k]===t) delete V.localGround[k];
  },
  /* ----- 건물·소품 ----- */
  setTool(t){ V.tool = t; if(t!=="move") V.sel = null; V.refresh(); },
  trayTap(i){
    const n = V.trayNames[i], c = V.ctx(), id = "b_"+n, it = c.items[id];
    if(!c.edit){ if(it) V.card(id); return; }
    if(it){ V.sel = id; V.tool = "move"; V.lookAt(it); V.refresh(); return; }
    if(!IMG[c.g+"|"+n]) return toast("그림을 불러오는 중이에요");
    const [x,y] = V.centerWorld();
    V.local[id] = { k:"b", r:n, x:Math.round(x), y:Math.round(y), s:1, f:0 }; V.sel = id; V.tool = "move"; V.refresh(); V.saveItem(id);
  },
  addProp(pid){
    const c = V.ctx(); if(!c.edit) return;
    if(Object.values(c.items).filter(i=>i.k==="p").length >= 80) return toast("소품은 80개까지 놓을 수 있어요");
    const [x,y] = V.centerWorld(), id = "p_"+uid();
    V.local[id] = { k:"p", r:pid, x:Math.round(x), y:Math.round(y), s:1, f:0 }; V.sel = id; V.tool = "move"; V.refresh(); V.saveItem(id);
  },
  act(k){
    const c = V.ctx(), id = V.sel, o = c.items[id]; if(!o || !c.edit) return;
    if(k==="x"){ clearTimeout(V.timers[id]); delete V.timers[id]; V.local[id] = null; V.sel = null; V.refresh(); V.saveItem(id); return; }
    const it = {...o};
    if(k==="l") it.x -= 4; if(k==="r") it.x += 4; if(k==="u") it.y -= 4; if(k==="d") it.y += 4;
    if(k==="+") it.s = Math.min(3, +(it.s*1.08).toFixed(3)); if(k==="-") it.s = Math.max(.3, +(it.s/1.08).toFixed(3));
    if(k==="f") it.f = it.f ? 0 : 1;
    it.x = clamp(it.x, 20, VW-20); it.y = clamp(it.y, 40, VH-10);
    V.local[id] = it; V.refresh();
    clearTimeout(V.timers[id]); V.timers[id] = setTimeout(() => V.saveItem(id), 700);   // 여러 번 눌러도 한 번만 저장
  },
  async saveItem(id){
    clearTimeout(V.timers[id]); delete V.timers[id];
    if(!(id in V.local)) return;
    const it = V.local[id];
    await DB.update("v"+S.group, d => { d.items ||= {}; if(it===null) delete d.items[id]; else d.items[id] = it; });
    S.vdata.items ||= {}; if(it===null) delete S.vdata.items[id]; else S.vdata.items[id] = it;
    if(V.local[id]===it) delete V.local[id];
  },
  flush(){ Object.keys(V.timers).forEach(id => V.saveItem(id)); },
  /* ----- 건물 설명 카드 + 칭찬 ----- */
  card(id){
    const c = V.ctx(), it = c.items[id]; if(!it || it.k!=="b") return;
    const d = c.designs[it.r] || {}, im = IMG[c.g+"|"+it.r];
    $("#modalRoot").innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)V.closeCard()">
      <div class="modal">
        <div class="left" style="text-align:center"><div class="checker" style="padding:14px">${im?`<img src="${im.data}" style="max-width:100%;max-height:300px" alt="">`:""}</div></div>
        <div class="right">
          <div><button class="close-x" onclick="V.closeCard()">✕</button><h3>${esc(bNameOf(c, it.r))}</h3></div>
          <div style="font-size:13px;color:var(--sub)">${c.g}모둠 · 설계자 ${esc(it.r)}</div>
          ${d.cause?`<div class="q" style="margin:0">🌍 해결하는 문제: ${esc(d.cause)}</div>`:""}
          ${(d.feats||[]).filter(f=>f.text).map(f=>`<div class="real" style="margin:0">${CATS[f.cat]?.icon||"✅"} ${esc(f.text)}</div>`).join("")}
        </div>
      </div>
    </div>`;
  },
  closeCard(){ $("#modalRoot").innerHTML = ""; },
};
window.V = V;


/* =========================================================
   9. 교사 앱 — 모둠 내용은 [불러오기] 할 때만 읽어요
   ========================================================= */
const T = {
  stage:1, g:1, data:null,
  init(){
    DB.watch("settings", d => { T.stage = d.stage||1; T.lock = !!d.lock; T.render(); });
    let last = 0; try{ last = +localStorage.getItem("ga_t_g"+CLS) || 0; }catch(e){}
    if(last) T.load(last);       // 새로고침하면 보던 모둠을 한 번 다시 불러와요
  },
  async resetPin(name){
    if(!await ask(`'${name}'을(를) 들어온 학생 목록에서 지울까요? (이름을 잘못 입력했을 때 써요)`)) return;
    await DB.update("g"+T.g, d => { if(d.pins) delete d.pins[name]; });
    T.load(T.g);
  },
  async toggleLock(){ await DB.update("settings", d => { d.lock = !d.lock; }); },
  async setStage(n){ await DB.update("settings", d => { d.stage = n; }); toast(`${n}단계까지 열었어요`); },
  async load(g){
    T.g = g; T.data = null; T.render();

    const d = await DB.get("g"+g); if(T.g!==g) return;

    if(await ensureImgs(g, d.imgs) && T.g===g) T.render();
  },
  /* ----- 발표용 마을 보기 (칠판 화면) ----- */
  openVillage(g){
    let el = $("#tVillage");
    if(!el){ el = document.createElement("div"); el.id = "tVillage"; el.className = "tvil"; document.body.appendChild(el); }
    el.innerHTML = `
      <div class="thead">
        <b style="font-family:'Jua';font-size:22px;margin-right:6px">🗺️ 모둠 마을 발표</b>
        ${Array.from({length:GROUP_COUNT},(_,i)=>`<button class="btn sm ${g===i+1?"":"ghost"}" onclick="T.openVillage(${i+1})">${i+1}모둠</button>`).join("")}
        <span style="flex:1"></span>
        <button class="btn sm ghost" onclick="T.openVillage(${g})" title="학생들이 고친 내용을 다시 불러와요">🔄 새로고침</button>
        <button class="btn sm ghost" onclick="T.full()">⛶ 전체 화면</button>
        <button class="btn sm" onclick="T.closeVillage()">✕ 닫기</button>
      </div>
      ${V.html()}`;
    V.mount(); V.loadView(g).then(() => V.fit());
  },
  full(){ const d = document; if(d.fullscreenElement) d.exitFullscreen?.(); else d.documentElement.requestFullscreen?.().catch(()=>{}); setTimeout(()=>{ if($("#vPort")) V.fit(); }, 300); },
  closeVillage(){ $("#tVillage")?.remove(); V.mode = 0; V.view = null; if(document.fullscreenElement) document.exitFullscreen?.(); },
  async delNote(id){
    if(!await ask("이 포스트잇을 지울까요?")) return;
    await DB.update("g"+T.g, d => { d.notes = (d.notes||[]).filter(x=>x.id!==id); });
    T.load(T.g);
  },
  async resetGroup(){
    if(!await ask(`${T.g}모둠의 보드, 마을 컨셉, 건물 목록, 설계 카드, 마을, 들어온 학생 목록을 모두 지울까요?`)) return;
    await DB.update("g"+T.g, d => { d.notes = []; d.buildings = []; d.designs = {}; d.imgs = {}; d.concept = null; d.pins = {}; });
    await DB.update("v"+T.g, d => { d.items = {}; d.ground = {}; d.likes = {}; });
    T.load(T.g);
  },
  render(){
    const d = T.data;
    $("#teacherMain").innerHTML = `
    <div class="t-grid">
      <div class="panel">
        <h3>🔑 ${CLS}반 입장 코드</h3>
        <div class="code-big">${esc(CLASS_CODE[CLS])}</div>
        <p style="font-size:13px;color:var(--sub);margin-bottom:6px">칠판에 적어 주세요.</p>
        <h3 style="margin-top:16px">🚦 단계 열기</h3>
        <p style="font-size:13px;color:var(--sub);margin-bottom:10px">누른 단계까지 학생에게 열려요.</p>
        <div class="stage-btns">${STEPS.map(s=>`<button class="${T.stage===s.n?"on":""}" onclick="T.setStage(${s.n})">${s.icon} ${s.n}단계 · ${s.name}${T.stage>=s.n?" ✓":""}</button>`).join("")}</div>
        <h3 style="margin-top:16px">🔒 마을 잠금</h3>
        <p style="font-size:13px;color:var(--sub);margin-bottom:10px">발표 시간에 잠그면 학생이 마을을 고칠 수 없어요.</p>
        <button class="btn ${T.lock?"red":"ghost"}" style="width:100%" onclick="T.toggleLock()">${T.lock?"🔒 잠겨 있음 (눌러서 풀기)":"🔓 열려 있음 (눌러서 잠그기)"}</button>
        <h3 style="margin-top:16px">🗺️ 모둠 마을 보기 (발표용)</h3>
        <p style="font-size:13px;color:var(--sub);margin-bottom:10px">칠판 화면에 크게 띄워요. 건물을 누르면 설명이 나와요.</p>
        <div class="gsel" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${Array.from({length:GROUP_COUNT},(_,i)=>`<button class="btn sm" onclick="T.openVillage(${i+1})">${i+1}모둠 마을</button>`).join("")}</div>
        ${useFirebase?"":`<p style="margin-top:12px"><span class="mode-badge">체험 모드</span></p>`}
      </div>
      <div class="panel">
        <h3>👀 모둠 살펴보기</h3>
        <div class="gsel">${Array.from({length:GROUP_COUNT},(_,i)=>`<button class="btn sm ${d&&T.g===i+1?"":"ghost"}" onclick="T.load(${i+1})">${i+1}모둠 불러오기</button>`).join("")}</div>
        ${!d ? `<p style="color:var(--sub)">${T.g&&localStorage.getItem("ga_t_g"+CLS)?"불러오는 중…":"모둠을 눌러 불러오세요."}</p>` : `
          <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;gap:6px;flex-wrap:wrap">
            <b style="font-size:18px">${T.g}모둠 · 포스트잇 ${(d.notes||[]).length}장 · 건물 ${(d.buildings||[]).length}개</b>
            <span style="display:flex;gap:6px"><button class="btn sm ghost" onclick="T.load(${T.g})">🔄 새로고침</button><button class="btn sm red" onclick="T.resetGroup()">이 모둠 초기화</button></span>
          </div>
          <div style="margin-bottom:12px"><b>🔐 들어온 학생</b> <span style="font-size:13px;color:var(--sub)">이름을 잘못 쳐서 생긴 학생은 [지우기]로 정리해요</span>
            <div class="pin-list" style="margin-top:6px">${Object.keys(d.pins||{}).map(n=>`<span>${esc(n)} <button class="btn sm ghost" style="padding:2px 8px" onclick="T.resetPin(${JSON.stringify(n).replace(/"/g,"&quot;")})">지우기</button></span>`).join("") || `<span style="color:var(--sub)">아직 없어요</span>`}</div></div>
          <div class="panel concept" style="padding:12px">${d.concept?`<div class="cview"><h2>🌱 ${esc(d.concept.name)}</h2><div class="theme">💡 ${esc(d.concept.theme)}</div><p>${esc(d.concept.desc)}</p></div>`:`<b>🌱 마을 컨셉</b> <span style="color:var(--sub)">아직 정하지 않았어요</span>`}</div>
          <div class="cause"><h3>🌍 기후 난민은 왜 생길까?</h3><div class="notes">${(d.notes||[]).filter(n=>n.cat==="cause").map(n=>`
            <div class="note"><div class="from">${esc(n.by)} · ❤️${n.hearts?.length||0}</div>${esc(n.idea)}
            <div class="foot"><span></span><button style="background:none;color:#d9534f;font-size:12px" onclick="T.delNote('${n.id}')">삭제</button></div></div>`).join("") || `<p style="color:var(--sub);font-size:13px">아직 없어요</p>`}</div></div>
          <div class="board">${Object.entries(CATS).map(([k,v])=>`
            <div class="col" style="border-color:${v.color};min-height:120px">
              <h3>${v.icon} ${v.name}</h3>
              ${(d.notes||[]).filter(n=>n.cat===k).map(n=>`
                <div class="note"><div class="from">${esc(n.by)}${n.cardTitle?` · ${esc(n.cardTitle)}`:""} · ❤️${n.hearts?.length||0}</div>
                ${esc(n.idea||"")}${n.problem?`<div><span class="k">해결:</span> ${esc(n.problem)}</div>`:""}${n.use?`<div><span class="k">우리 마을:</span> ${esc(n.use)}</div>`:""}
                <div class="foot"><span></span><button style="background:none;color:#d9534f;font-size:12px" onclick="T.delNote('${n.id}')">삭제</button></div></div>`).join("")}
            </div>`).join("")}
          </div>
          <h3 style="margin:16px 0 8px">📐 학생 건물 설계 (${Object.keys(d.designs||{}).length}명)</h3>
          ${Object.entries(d.designs||{}).map(([who,x])=>T.dcard(who,x)).join("") || `<p style="color:var(--sub)">아직 없어요</p>`}
          <h3 style="margin:16px 0 8px">🏘️ 건물 목록</h3>
          ${(d.buildings||[]).map((b,i)=>`<div class="bitem"><div class="num">${i+1}</div><div class="info"><b>${esc(b.name)}</b> ${b.cats.map(k=>CATS[k].icon).join("")}<p>${esc(b.desc||"")}</p></div>${b.owner?`<span class="owner">👤 ${esc(b.owner)}</span>`:`<span class="owner" style="background:#ffe9e0;color:#c0502a">담당 없음</span>`}</div>`).join("") || `<p style="color:var(--sub)">아직 없어요</p>`}
        `}
      </div>
    </div>`;
  },
};
T.dcard = (who, x) => {
  const im = IMG[T.g+"|"+who], miss = missingOf({feats:[], mats:[], ...x});
  const look = [x.floor, x.roof, x.color && `색깔: ${x.color}`].filter(Boolean).map(esc).join(" · ");
  return `<div class="dcard">
    <div class="thumb">${im?`<img src="${im.data}" alt="">`:"건물 그림<br>아직 없음"}</div>
    <div>
      <h4>${esc(x.name||"(이름 없음)")} <span style="font-size:14px;color:var(--sub)">· ${esc(who)}</span> ${miss.length?`<span class="status no">미완성</span>`:`<span class="status ok">완성</span>`}</h4>
      <div class="dinfo">
        <div><span class="k">해결하는 문제</span> ${esc(x.cause||"-")}</div>
        ${(x.feats||[]).filter(f=>f.text).map((f,i)=>`<div>${CATS[f.cat]?.icon||"✅"} ${esc(f.text)}</div>`).join("")}
        ${look?`<div><span class="k">생김새</span> ${look}</div>`:""}
        ${(x.mats||[]).length?`<div><span class="k">재료</span> ${x.mats.map(esc).join(", ")}</div>`:""}
        ${x.must?`<div><span class="k">꼭 지킬 것</span> ${esc(x.must)}</div>`:""}
        ${miss.length?`<div style="color:#c0502a;font-size:13px">빠진 것: ${miss.join(", ")}</div>`:""}
      </div>
      <details style="margin-top:6px"><summary style="cursor:pointer;font-size:13px;color:var(--sub)">AI 주문서 보기</summary><div class="prompt" style="margin-top:6px">${esc(buildPrompt({feats:[], mats:[], ...x},true))}</div></details>
    </div>
  </div>`;
};
window.T = T;

App.init();
</script>
</body>
</html>
